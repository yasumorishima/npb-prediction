name: Annual NPB Update

on:
  schedule:
    - cron: '0 9 1 3 *'   # 毎年3月1日 9:00 UTC（FA・移籍確定後、開幕前）
  workflow_dispatch:
    inputs:
      memo:
        description: 'この実行の意図'
        required: false
        type: string
      data_end_year:
        description: 'Last season year (e.g., 2025). Leave blank for previous year.'
        required: false
        default: ''
      hf_only:
        description: 'Skip fetch/projections — only sync current repo data/ to Hugging Face'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

# Storage: data/ in this repo is canonical (git-versioned) for model outputs,
# aggregates and team standings. The player-level tables (baseball-data.com /
# npb.jp) are restricted: they live in the private repo
# yasumorishima/npb-restricted-inputs, are restored into the workspace at the
# start and pushed back before the public commit, and are never committed here
# or uploaded. Each run also mirrors data/ (without the restricted tables) to
# the public HF dataset yasumorishima/npb-stats (same as mlb-stats /
# japan-geohazard).
# BQ steps are legacy (continue-on-error); HF is the cloud store of record.
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # Restricted NPB tables (baseball-data.com / npb.jp, no redistribution right)
      # live in the PRIVATE repo yasumorishima/npb-restricted-inputs. Check it out
      # with the deploy key and copy the tables into the workspace (md5 verified).
      # .gitignore keeps them out of every public commit; see tools/restricted_sync.sh.
      - name: Check the restricted-data deploy key
        if: github.event.inputs.hf_only != 'true'
        env:
          NPB_RESTRICTED_DEPLOY_KEY: ${{ secrets.NPB_RESTRICTED_DEPLOY_KEY }}
        run: |
          if [ -z "$NPB_RESTRICTED_DEPLOY_KEY" ]; then
            echo "::error::Secret NPB_RESTRICTED_DEPLOY_KEY is empty: add the private key of a deploy key on yasumorishima/npb-restricted-inputs."
            exit 1
          fi

      - name: Check out the restricted tables (private repo)
        if: github.event.inputs.hf_only != 'true'
        uses: actions/checkout@v4
        with:
          repository: yasumorishima/npb-restricted-inputs
          ssh-key: ${{ secrets.NPB_RESTRICTED_DEPLOY_KEY }}
          path: _restricted

      - name: Restore the restricted tables into the workspace
        if: github.event.inputs.hf_only != 'true'
        run: bash "$GITHUB_WORKSPACE/tools/restricted_sync.sh" pull

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        if: github.event.inputs.hf_only != 'true'
        run: pip install pandas numpy beautifulsoup4 requests lxml scikit-learn lightgbm xgboost joblib wandb pyarrow

      - name: Set DATA_END_YEAR
        if: github.event.inputs.hf_only != 'true'
        run: |
          if [ -n "${{ github.event.inputs.data_end_year }}" ]; then
            echo "NPB_DATA_END_YEAR=${{ github.event.inputs.data_end_year }}" >> "$GITHUB_ENV"
          else
            # 3月実行: 前年シーズンのデータを対象にする
            echo "NPB_DATA_END_YEAR=$(($(date +'%Y') - 1))" >> "$GITHUB_ENV"
          fi

      - name: 1. Fetch hitter/pitcher stats
        if: github.event.inputs.hf_only != 'true'
        run: python fetch_npb_data.py
        env:
          NPB_DATA_END_YEAR: ${{ env.NPB_DATA_END_YEAR }}
          PYTHONUNBUFFERED: "1"

      - name: 2. Fetch detailed batting stats
        if: github.event.inputs.hf_only != 'true'
        run: python fetch_npb_detailed.py
        env:
          NPB_DATA_END_YEAR: ${{ env.NPB_DATA_END_YEAR }}
          PYTHONUNBUFFERED: "1"

      - name: 3. Fetch NPB registered player roster (FA・移籍確定後)
        if: github.event.inputs.hf_only != 'true'
        run: python fetch_rosters.py
        env:
          NPB_DATA_END_YEAR: ${{ env.NPB_DATA_END_YEAR }}
          PYTHONUNBUFFERED: "1"

      - name: 4. Fetch standings + Pythagorean
        if: github.event.inputs.hf_only != 'true'
        run: python pythagorean.py
        env:
          NPB_DATA_END_YEAR: ${{ env.NPB_DATA_END_YEAR }}
          PYTHONUNBUFFERED: "1"

      - name: 5. Calculate wOBA/wRC+ (sabermetrics)
        if: github.event.inputs.hf_only != 'true'
        run: python sabermetrics.py
        env:
          NPB_DATA_END_YEAR: ${{ env.NPB_DATA_END_YEAR }}
          PYTHONUNBUFFERED: "1"

      # The app reads only these league aggregates, not the restricted table.
      - name: 5.5 League constants for the app (aggregates only)
        if: github.event.inputs.hf_only != 'true'
        run: python league_constants.py
        env:
          NPB_DATA_END_YEAR: ${{ env.NPB_DATA_END_YEAR }}
          PYTHONUNBUFFERED: "1"

      - name: 6. Marcel projections
        if: github.event.inputs.hf_only != 'true'
        run: python marcel_projection.py
        env:
          NPB_DATA_END_YEAR: ${{ env.NPB_DATA_END_YEAR }}
          PYTHONUNBUFFERED: "1"

      - name: 7. ML projections (LightGBM/XGBoost)
        if: github.event.inputs.hf_only != 'true'
        run: python ml_projection.py
        env:
          NPB_DATA_END_YEAR: ${{ env.NPB_DATA_END_YEAR }}
          WANDB_API_KEY: ${{ secrets.WANDB_API_KEY }}
          PYTHONUNBUFFERED: "1"

      # 区間の σ の係数は posteriors.json に置いてあり、tools/fit_sigma_model.py で
      # 出した値を手写ししている。tests/test_sigma_model.py が出場機会ごとの σ を
      # 実数表で固定しているので、係数を更新して表を作り直し忘れるとここで落ちる。
      # この step が無いと「忘れたら落ちる」が一度も発動しない。
      # 書き出しの門（_finalize_outputs）も縛る。tests/test_output_gating.py は
      # 打者・投手のどちらかが 0 行でも fail-closed が発動することを固定する。
      # ⚠️ step 名は「commit の前に落ちる」であって「何も書く前に」ではない。
      #    step 6/7 が既に marcel_*.csv / ml_*.csv を書いた後にここが走る。
      # ⚠️ hf_only の run では「Install dependencies」が skip されるので、この step に
      #    ガードが無いと numpy / pandas が無いまま走って ModuleNotFoundError で落ち、
      #    HF 同期に一度も到達しない。hf_only は data/ を再生成しないので門も要らない。
      - name: 7.5 Sigma model + output gating tests (fail before the commit step)
        if: github.event.inputs.hf_only != 'true'
        run: |
          python tests/test_sigma_model.py
          python tests/test_output_gating.py

      - name: 8. Bayesian projections (Stan correction + BMA + foreign players)
        if: github.event.inputs.hf_only != 'true'
        run: python bayes_projection.py
        env:
          NPB_DATA_END_YEAR: ${{ env.NPB_DATA_END_YEAR }}
          PYTHONUNBUFFERED: "1"

      - name: 9. Team Monte Carlo simulation (10,000 draws)
        if: github.event.inputs.hf_only != 'true'
        run: python team_simulation.py
        env:
          NPB_DATA_END_YEAR: ${{ env.NPB_DATA_END_YEAR }}
          PYTHONUNBUFFERED: "1"

      # Before the public commit: main must never hold outputs built from tables
      # the private repo does not have. A no-op when nothing changed.
      - name: Push the restricted tables back to the private repo
        if: github.event.inputs.hf_only != 'true'
        run: |
          bash tools/restricted_sync.sh push \
            "auto: NPB tables for ${NPB_DATA_END_YEAR} season ($(date +'%Y-%m-%d'), npb-prediction@${GITHUB_SHA::7})"

      - name: Stage public data
        if: github.event.inputs.hf_only != 'true'
        run: git add data/

      - name: Guard - no restricted file in the public commit
        if: github.event.inputs.hf_only != 'true'
        run: bash "$GITHUB_WORKSPACE/tools/restricted_sync.sh" guard

      - name: Commit and push updated data
        if: github.event.inputs.hf_only != 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          if git diff --staged --quiet; then
            echo "No data changes to commit"
          else
            git commit -m "auto: update NPB data and projections for ${NPB_DATA_END_YEAR} season ($(date +'%Y-%m-%d'))"
            git push
          fi

      # === Hugging Face mirror (canonical cloud store) ===
      - name: Install huggingface_hub
        run: pip install --quiet "huggingface_hub>=0.26"

      - name: Upload data/ to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "HF_TOKEN secret is not set — cannot sync to HF"
            exit 1
          fi
          # Upload a copy of data/ without the restricted tables (hf-stage removes
          # them and fails if any is left). Works the same in hf_only mode.
          STAGE="$RUNNER_TEMP/hf_stage/data"
          bash tools/restricted_sync.sh hf-stage "$STAGE"
          hf upload yasumorishima/npb-stats "$STAGE" data \
            --repo-type dataset \
            --commit-message "Sync npb-prediction data/ ($(date +'%Y-%m-%d'))"
          echo "Synced data/ -> https://huggingface.co/datasets/yasumorishima/npb-stats"
