name: "Research: Marcel weights (merged from npb-marcel-weight-study)"
# Marcel weight grid search: w0/w1/w2 over NPB 2019-2025

on:
  workflow_dispatch:
    inputs:
      memo:
        description: 'この実行の意図（必須）'
        required: true
        type: string
defaults:
  run:
    working-directory: research/marcel-weights

jobs:
  optimize:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      # Restricted NPB tables (baseball-data.com / npb.jp, no redistribution right)
      # live in the PRIVATE repo yasumorishima/npb-restricted-inputs. Check it out
      # with the deploy key and copy the tables into the workspace (md5 verified).
      # .gitignore keeps them out of every public commit; see tools/restricted_sync.sh.
      - name: Check the restricted-data deploy key
        env:
          NPB_RESTRICTED_DEPLOY_KEY: ${{ secrets.NPB_RESTRICTED_DEPLOY_KEY }}
        run: |
          if [ -z "$NPB_RESTRICTED_DEPLOY_KEY" ]; then
            echo "::error::Secret NPB_RESTRICTED_DEPLOY_KEY is empty: add the private key of a deploy key on yasumorishima/npb-restricted-inputs."
            exit 1
          fi

      - name: Check out the restricted tables (private repo)
        uses: actions/checkout@v4
        with:
          repository: yasumorishima/npb-restricted-inputs
          ssh-key: ${{ secrets.NPB_RESTRICTED_DEPLOY_KEY }}
          path: _restricted

      - name: Restore the restricted tables into the workspace
        run: bash "$GITHUB_WORKSPACE/tools/restricted_sync.sh" pull

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pandas numpy

      - name: Run weight optimization
        run: python optimize_weights.py

      - name: Stage results
        run: git add results/

      - name: Guard - no restricted file in the public commit
        run: bash "$GITHUB_WORKSPACE/tools/restricted_sync.sh" guard

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --cached --quiet || git commit -m "add weight optimization results"
          git pull --rebase
          git push

